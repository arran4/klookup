name: Build and Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Bootstrap environment
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd
        ./.jules/bootstrap.sh

    - name: Install dependencies
      run: |
        ./.jules/run.sh apt-get update
        ./.jules/run.sh apt-get install -y libkf6runner-dev libkf6globalaccel-dev zlib1g-dev cmake ninja-build build-essential g++

    - name: Configure CMake
      run: ./.jules/run.sh cmake -S . -B build -G Ninja -DBUILD_TESTING=ON

    - name: Build klookup_with_plugins and tests
      run: ./.jules/run.sh cmake --build build --parallel

    - name: Run CTest
      run: ./.jules/run.sh ctest --test-dir build --output-on-failure

    - name: Configure sanitizer build
      run: |
        ./.jules/run.sh cmake -S . -B build-san -G Ninja -DBUILD_TESTING=ON \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build sanitizer targets
      run: ./.jules/run.sh cmake --build build-san --parallel

    - name: Run sanitizer CTest with leak detection
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: ./.jules/run.sh ctest --test-dir build-san --output-on-failure
