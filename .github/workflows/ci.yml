# Generated using:
# https://arran4.github.io/blog/post/2026/043-canonical-github-actions-ci-cd-super-reference/
# Documentation publishing follows:
# https://arran4.github.io/blog/post/2026/058-hugo-book-github-pages-for-go-documentation/
name: CI and documentation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
  schedule:
    - cron: '0 19 1 * *' # Monthly verification (02:00 AEDT / 05:00 AEST)

permissions:
  contents: read

# Superseded PR runs are expendable. Main runs and Pages publishing are not.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-validation:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

  cmake-test:
    name: Qt/KF6 build, tests, sanitizers and licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Bootstrap KDE development rootfs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          ./.jules/bootstrap.sh
      - name: Install Qt/KF6 and build dependencies
        run: |
          set -euo pipefail
          ./.jules/run.sh apt-get update
          ./.jules/run.sh apt-get install -y libkf6runner-dev libkf6globalaccel-dev zlib1g-dev cmake ninja-build build-essential g++
      - name: Verify REUSE licensing
        run: ./.jules/run.sh reuse lint
      - name: Configure normal build
        run: ./.jules/run.sh cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - name: Build application, providers and tests
        run: ./.jules/run.sh cmake --build build --parallel
      - name: Test application and staged installation
        run: ./.jules/run.sh ctest --test-dir build --output-on-failure
      - name: Configure ASan/UBSan build
        run: |
          ./.jules/run.sh cmake -S . -B build-san -G Ninja -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build ASan/UBSan application and tests
        run: ./.jules/run.sh cmake --build build-san --parallel
      - name: Test under ASan/UBSan with leak detection
        run: |
          ./.jules/run.sh env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ctest --test-dir build-san --output-on-failure

  docs-build:
    name: Build developer documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation generator
        run: python -m pip install 'mkdocs==1.6.1'
      - name: Validate and build documentation
        run: mkdocs build --strict
      - name: Archive PR documentation preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: site/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  pages-deploy:
    name: Deploy GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [workflow-validation, cmake-test, docs-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated documentation
        id: deployment
        uses: actions/deploy-pages@v5
